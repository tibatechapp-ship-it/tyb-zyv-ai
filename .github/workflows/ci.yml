name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Lint / type-check / syntax across supported Python versions ───────────
  lint:
    name: lint & type-check (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy textual

      - name: Byte-compile (syntax check)
        run: |
          python -m py_compile zyvo-telegram.py zyvo-voice.py
          python -m compileall -q src

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Mypy type-check
        run: mypy zyvo-telegram.py zyvo-voice.py src

      - name: Type-hint coverage (every function annotated)
        run: python scripts/check_annotations.py

  # ── Security: make sure no secret ever lands in the tree ──────────────────
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject committed secrets / env files
        run: |
          fail=0
          if git ls-files | grep -E '(^|/)\.env$|telegram\.env$'; then
            echo "::error::A secrets file is tracked in git."
            fail=1
          fi
          if git grep -nE '[0-9]{8,10}:[A-Za-z0-9_-]{35}|ghp_[A-Za-z0-9]{36}|-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . ':(exclude)*.md' 2>/dev/null; then
            echo "::error::Possible hardcoded secret found."
            fail=1
          fi
          if [ "$fail" -eq 0 ]; then echo "No secrets detected."; fi
          exit $fail
